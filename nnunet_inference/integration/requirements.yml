name: nnunet-vsseg
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # CPU torch is pinned before nnunetv2 to avoid resolving CUDA wheels.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.8.0+cpu
      - nnunetv2==2.6.2
      - dynamic-network-architectures==0.4.2
      - imagedata==3.9.7
      - SimpleITK==2.5.2
      - pydicom==3.0.2
      - numpy==2.2.6
