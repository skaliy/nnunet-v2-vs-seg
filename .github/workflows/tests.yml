name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Shell syntax
        run: |
          for script in nnunet_inference/integration/*.sh; do bash -n "$script"; done
      - name: Unit tests
        run: python -m unittest discover -s nnunet_inference/tests -p 'test_*.py' -v
      - name: VS workstation checks (skipped here; catches import errors)
        run: python -m unittest discover -s projects/vs/checks -p 'test_*.py' -v
